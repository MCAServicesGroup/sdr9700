name: Bug report
description: Report a problem or regression in sdr9700.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. The details below help us reproduce it without requiring you to diagnose it first.

        Do not include radio passwords, GitHub tokens, private IP details you do not want public, or unredacted packet captures.

  - type: input
    id: version
    attributes:
      label: sdr9700 version or commit
      description: Use the title bar version, About dialog version, or `git rev-parse --short HEAD`.
      placeholder: "26.9.2 or 8970a7b"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Startup / connection
        - Disconnect / reconnect
        - Frequency / VFO control
        - Mode / filter control
        - Offset / tone / CTCSS / DCS
        - Spectrum / waterfall
        - RX audio
        - TX audio / PTT
        - Memories
        - Preferences / profiles
        - Packaging / build
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem, including any visible error or unexpected radio behavior.
      placeholder: "When I..., sdr9700..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Briefly describe the result you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps so another operator can reproduce the issue.
      placeholder: |
        1. Connect to the IC-9700
        2. Select ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and installation method. Add desktop, Qt, or audio details only when relevant or known.
      placeholder: |
        - OS and version:
        - Installed from release package or built from source:
        - Desktop/session or Mac model, if relevant:
        - Qt and audio devices, if relevant:
    validations:
      required: true

  - type: textarea
    id: radio
    attributes:
      label: IC-9700 details
      description: Include firmware version, LAN connection type, and any relevant radio-side settings. Redact credentials.
      placeholder: |
        - IC-9700 firmware:
        - LAN/wired or Wi-Fi:
        - CI-V address:
        - Relevant radio settings:

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or captures
      description: Attach screenshots or recordings, or paste relevant output from `--log=radio,udp,ci-v` when useful. Redact credentials, tokens, public IPs, and anything station-private.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed or redacted passwords, tokens, and private station details.
          required: true

name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  QT_VERSION: 6.8.3

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure LLVM 23 package repository
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ca-certificates gnupg wget
          wget -q https://apt.llvm.org/llvm-snapshot.gpg.key -O "$RUNNER_TEMP/apt.llvm.org.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/apt.llvm.org.asc" \
            | awk -F: '$1 == "fpr" { print $10; exit }')" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo install -m 0644 "$RUNNER_TEMP/apt.llvm.org.asc" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-23.list
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            clang-format-23 \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libqt6sql6-sqlite libssl-dev libopus-dev \
            libspeexdsp-dev libxkbcommon-dev libeigen3-dev libhidapi-dev
          clang-format-23 --version | grep -E 'clang-format version 23\.'
          cmake --version
      - name: Build cppcheck 2.21.0
        run: |
          wget -q https://github.com/cppcheck-opensource/cppcheck/archive/refs/tags/2.21.0.tar.gz \
            -O "$RUNNER_TEMP/cppcheck-2.21.0.tar.gz"
          echo "f028ff75ca5372738f3737c8b3e8611426a6526b6aea2ef01301ab0f5902f044  $RUNNER_TEMP/cppcheck-2.21.0.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cppcheck-2.21.0.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/cppcheck-2.21.0" -B "$RUNNER_TEMP/cppcheck-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/cppcheck-build" -j2
          echo "$RUNNER_TEMP/cppcheck-build/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cppcheck-build/bin/cppcheck" --version | grep -F "Cppcheck 2.21.0"
      - name: Build
        run: make release
      - name: Source checks
        run: make check
      - name: Test
        run: ctest --test-dir src/build --output-on-failure

  macos:
    name: Apple Silicon macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config openssl@3 opus speexdsp eigen hidapi
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --disable-pip-version-check aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            -m qtmultimedia qtshadertools
          qt_root="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          test -x "$qt_root/bin/qmake"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$qt_root" >> "$GITHUB_ENV"
          "$qt_root/bin/qmake" -query QT_VERSION
      - name: Build
        run: make release
      - name: Verify Metal panadapter build
        run: |
          grep -Fq 'SDR9700_ENABLE_GPU_PANADAPTER:BOOL=ON' src/build/CMakeCache.txt
          nm src/build/bin/SDR9700.app/Contents/MacOS/SDR9700 \
            | grep -F 'qInitResources_SDR9700_panadapter_shaders' >/dev/null
      - name: Test
        run: ctest --test-dir src/build --output-on-failure
      - name: Verify self-contained application bundle
        run: make bundle

  linux-no-hidapi:
    name: Linux without HIDAPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libqt6sql6-sqlite libssl-dev libopus-dev \
            libspeexdsp-dev libxkbcommon-dev libeigen3-dev
      - name: Build without HIDAPI
        run: |
          cmake -S . -B src/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDR9700_ENABLE_HIDAPI=OFF
          cmake --build src/build -j2
          grep -Fq 'SDR9700_ENABLE_HIDAPI:BOOL=OFF' src/build/CMakeCache.txt
      - name: Test
        run: ctest --test-dir src/build --output-on-failure

  linux-gpu-panadapter:
    name: Linux GPU panadapter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3-venv xauth xvfb \
            libssl-dev libopus-dev libspeexdsp-dev libeigen3-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Qt
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --disable-pip-version-check aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            -m qtmultimedia qtshadertools
          qt_root="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"
          test -x "$qt_root/bin/qmake"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$qt_root" >> "$GITHUB_ENV"
          "$qt_root/bin/qmake" -query QT_VERSION
      - name: Build GPU panadapter
        run: |
          cmake -S . -B src/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDR9700_ENABLE_GPU_PANADAPTER=ON
          cmake --build src/build -j2
          grep -Fq 'SDR9700_ENABLE_GPU_PANADAPTER:BOOL=ON' src/build/CMakeCache.txt
      - name: Test with software Vulkan
        run: xvfb-run -a env SDR9700_TEST_RHI_BACKEND=vulkan ctest --test-dir src/build --output-on-failure

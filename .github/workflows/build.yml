name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure LLVM 23 package repository
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ca-certificates wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-23.list
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            clang-format-23 \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libqt6sql6-sqlite libssl-dev libopus-dev \
            libspeexdsp-dev libxkbcommon-dev libeigen3-dev libhidapi-dev
          clang-format-23 --version | grep -E 'clang-format version 23\.'
      - name: Build cppcheck 2.21.0
        run: |
          wget -q https://github.com/cppcheck-opensource/cppcheck/archive/refs/tags/2.21.0.tar.gz \
            -O "$RUNNER_TEMP/cppcheck-2.21.0.tar.gz"
          echo "f028ff75ca5372738f3737c8b3e8611426a6526b6aea2ef01301ab0f5902f044  $RUNNER_TEMP/cppcheck-2.21.0.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cppcheck-2.21.0.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/cppcheck-2.21.0" -B "$RUNNER_TEMP/cppcheck-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/cppcheck-build" -j2
          echo "$RUNNER_TEMP/cppcheck-build/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cppcheck-build/bin/cppcheck" --version | grep -F "Cppcheck 2.21.0"
      - name: Build
        run: make release
      - name: Source checks
        run: make check
      - name: Test
        run: ctest --test-dir src/build --output-on-failure

  macos:
    name: Apple Silicon macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install dependencies
        run: brew install cmake ninja pkg-config qt openssl@3 opus speexdsp eigen hidapi
      - name: Configure Homebrew tools
        run: echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make release
      - name: Verify Metal panadapter build
        run: grep -Fq 'sdr9700_ENABLE_GPU_PANADAPTER:BOOL=ON' src/build/CMakeCache.txt
      - name: Test
        run: ctest --test-dir src/build --output-on-failure
      - name: Verify self-contained application bundle
        run: make bundle

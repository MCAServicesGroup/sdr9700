name: Release macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: true
        default: main
      release_tag:
        description: Existing GitHub Release tag to replace the DMG on (optional)
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  QT_VERSION: 6.8.3

jobs:
  package:
    name: Apple Silicon macOS
    runs-on: macos-15

    steps:
      - name: Select source ref
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            printf 'ref=%s\n' "$EVENT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
            printf 'release_tag=%s\n' "$EVENT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_RELEASE_TAG" ]]; then
            printf 'ref=%s\n' "$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
            printf 'release_tag=%s\n' "$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\n' "$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Verify runner and release version
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          test "$(uname -m)" = "arm64"
          version="$(sed -n 's/^set(SDR9700_DISPLAY_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)"
          test -n "$version"
          if [[ -n "$RELEASE_TAG" ]]; then
            expected_tag="v${version}"
            if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
              echo "::error::Release tag must be ${expected_tag}"
              exit 1
            fi
          fi

      - name: Verify target GitHub Release
        if: steps.source.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: gh release view "$RELEASE_TAG"

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkg-config openssl@3 opus speexdsp eigen hidapi
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --disable-pip-version-check aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 \
            --outputdir "$RUNNER_TEMP/Qt" \
            -m qtmultimedia qtshadertools
          qt_root="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          test -x "$qt_root/bin/qmake"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$qt_root" >> "$GITHUB_ENV"
          "$qt_root/bin/qmake" -query QT_VERSION

      - name: Build and test
        run: |
          make release
          grep -Fq 'SDR9700_ENABLE_GPU_PANADAPTER:BOOL=ON' src/build/CMakeCache.txt
          nm src/build/bin/SDR9700.app/Contents/MacOS/SDR9700 \
            | grep -F 'qInitResources_SDR9700_panadapter_shaders' >/dev/null
          ctest --test-dir src/build --output-on-failure

      - name: Import Developer ID certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/sdr9700-build.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          echo "$APPLE_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain_path" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

      - name: Bundle, audit, sign, and create DMG
        env:
          SDR9700_SIGN_IDENTITY: Developer ID Application
        run: |
          make release-dmg
          make verify-bundle
          codesign --verify --deep --strict --verbose=2 src/build/bin/SDR9700.app

          dmg_path="$(find src/build/package -maxdepth 1 -name 'SDR9700-*-macOS-apple-silicon.dmg' -print -quit)"
          test -n "$dmg_path"
          echo "SDR9700_DMG=$dmg_path" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "sdr9700-ci" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Notarize and staple DMG
        env:
          SDR9700_NOTARY_PROFILE: sdr9700-ci
        run: |
          make notarize DMG="$SDR9700_DMG"
          xcrun stapler validate "$SDR9700_DMG"
          spctl --assess --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$SDR9700_DMG"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SDR9700-macOS-apple-silicon
          path: ${{ env.SDR9700_DMG }}
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: steps.source.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$SDR9700_DMG" --clobber
